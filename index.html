<style>
:root{--bg:#F2F2EE;--ink:#25292A;--muted:#6A6F6B;--line:#E1E2DC;--accent:#3D6158;--accent-ink:#fff;color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181A19;--ink:#E8E9E4;--muted:#9DA29D;--line:#323634;--accent:#8DB5A8;--accent-ink:#13201C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181A19;--ink:#E8E9E4;--muted:#9DA29D;--line:#323634;--accent:#8DB5A8;--accent-ink:#13201C;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:40px 20px 60px}
h1{font:600 clamp(36px,6vw,52px)/1 "Cormorant Garamond",Georgia,serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:14px;margin-bottom:8px}
#total{color:var(--muted);font-size:15px;white-space:nowrap}
.cols{columns:2 340px;column-gap:48px}
section{break-inside:avoid-column;padding-top:26px}
h2{font:600 24px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 span{font:400 13px "Figtree",sans-serif;color:var(--muted)}
label{display:flex;gap:12px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;break-inside:avoid}
input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;border:1.5px solid var(--muted);border-radius:5px;cursor:pointer;display:grid;place-content:center}
input:checked{background:var(--accent);border-color:var(--accent)}
input:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
section.wide{column-span:all;border-top:1px solid var(--ink);margin-top:30px}
section.wide .inner{columns:2 340px;column-gap:48px}
@media (max-width:640px){section.wide .inner{columns:1}}
h3{font-size:13px;font-weight:500;color:var(--muted);margin:18px 0 2px;break-after:avoid}
label small{display:block;font-size:13px;color:var(--muted);text-decoration:none}
details>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details>summary::-webkit-details-marker{display:none}
summary h2::before{content:"";flex:none;width:8px;height:8px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);margin-right:4px;align-self:center;transition:transform .15s}
details[open]>summary h2::before{transform:rotate(45deg)}
summary h2 b{font-weight:600;flex:1}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
label.hide{border:0;padding:0;font-size:14px;color:var(--muted);gap:8px;align-items:center}
label.hide input{width:18px;height:18px;margin:0}
label.hide input:checked+span{text-decoration:none;color:var(--ink)}
body.hidedone .items label:has(input:checked){display:none}
.ok{color:var(--accent)}
.sync{display:flex;gap:12px;align-items:center;margin:12px 0 0;font-size:13px;color:var(--muted)}
.sync button{flex:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font:500 14px "Figtree",system-ui,sans-serif;cursor:pointer}
@media print{.sync{display:none}}
@media (max-width:640px){
  body{font-size:17px}
  main{padding:0 16px 48px}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;margin:0 -16px 0;padding-left:16px;padding-right:16px;align-items:center}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
  h1{font-size:30px}
  .top{flex-wrap:wrap;gap:8px}
  .side{flex-direction:row;width:100%;justify-content:space-between;align-items:center}
  #total{font-size:14px}
  label.hide span{white-space:nowrap}
  section{padding-top:0;border-bottom:1px solid var(--line)}
  section.wide{margin-top:0;border-top:0}
  summary{padding:16px 0}
  h2{margin:0;font-size:23px}
  .items{padding-bottom:12px}
  .items label{padding:12px 0;min-height:48px;align-items:center}
  .items label:has(small){align-items:flex-start}
  .items input{width:26px;height:26px;border-radius:7px}
  .items input:checked::after{width:6px;height:12px}
}
.msg{font-size:13px;color:var(--muted);margin:10px 0 0}
.msg:empty{display:none}
@media print{:root{--bg:#fff;--ink:#000;--muted:#555;--line:#ccc;padding:0}main{padding:0}body{font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}input{width:12px;height:12px;border-radius:2px}label{padding:3px 0}.msg{display:none}label.hide{display:none}summary h2::before{display:none}}
</style>
</head>

<script>
(function(){
const CATS={woon:'Woonkamer',keuken:'Keuken',slaap:'Slaapkamer',bad:'Badkamer en wc',was:'Wasruimte en schoonmaak',hal:'Hal en berging',tech:'Elektronica en techniek',tools:'Gereedschap en klein materiaal',admin:'Administratie en contracten',plan:'Verhuisplanning',food:'Eerste boodschappen',veilig:'Veiligheid en noodpakket',later:'Later en optioneel',gastouder:'Gastouderopvang van Marin'};
const items=[]; const seen=new Set(); let cat='', sub='';
for(const raw of document.getElementById('data').textContent.split('\n')){
  const l=raw.trim(); if(!l) continue; if(l[0]==='#'){sub=l.slice(1);continue} if(l[0]==='@'){cat=l.slice(1);continue}
  const p=l.split('|'); const s=p[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
  let id=cat+'-'+s,k=2; while(seen.has(id)) id=cat+'-'+s+'-'+(k++); if(p[7]) id=p[7]; seen.add(id);
  items.push({id,cat,sub,name:p[0],note:p[6]||''});
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let checked={}; const db=null;
const KEY='verhuis-simpel-v1';
try{checked=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const list=document.getElementById('list');
const OKEY='verhuis-simpel-open'; let openState={}; try{openState=JSON.parse(localStorage.getItem(OKEY)||'{}')}catch(e){}
const phone=window.matchMedia('(max-width:640px)').matches;
list.innerHTML=Object.keys(CATS).map(c=>`<section data-c="${c}"${c==='gastouder'?' class="wide"':''}><details data-c="${c}"${(openState[c]??!phone)?' open':''}><summary><h2><b>${CATS[c]}</b><span></span></h2></summary><div class="items${c==='gastouder'?' inner':''}">`+
  items.filter(i=>i.cat===c).map((i,n,a)=>(c==='gastouder'&&(n===0||a[n-1].sub!==i.sub)?`<h3>${esc(i.sub)}</h3>`:'')+`<label><input type="checkbox" data-id="${i.id}"><span>${esc(i.name)}${c==='gastouder'&&i.note?`<small>${esc(i.note)}</small>`:''}</span></label>`).join('')+'</div></details></section>').join('');
list.addEventListener('toggle',e=>{const d=e.target; if(d.tagName!=='DETAILS') return; openState[d.dataset.c]=d.open; try{localStorage.setItem(OKEY,JSON.stringify(openState))}catch(_){} },true);
window.addEventListener('beforeprint',()=>list.querySelectorAll('details').forEach(d=>d.open=true));
const hideEl=document.getElementById('hide'); try{hideEl.checked=localStorage.getItem('verhuis-simpel-hide')==='1'}catch(e){} document.body.classList.toggle('hidedone',hideEl.checked);
hideEl.addEventListener('change',()=>{document.body.classList.toggle('hidedone',hideEl.checked); try{localStorage.setItem('verhuis-simpel-hide',hideEl.checked?'1':'0')}catch(e){}});
function paint(){
  list.querySelectorAll('input').forEach(el=>{el.checked=!!checked[el.dataset.id]});
  count();
}
function count(){
  let n=0; for(const i of items) if(checked[i.id]) n++;
  document.getElementById('total').textContent=`${n} van ${items.length} afgevinkt`;
  list.querySelectorAll('section').forEach(s=>{const its=items.filter(i=>i.cat===s.dataset.c); s.querySelector('h2 span').textContent=`${its.filter(i=>checked[i.id]).length}/${its.length}`;});
}
const busy=new Set(),pend=new Set();
async function save(id){
  if(!db){ try{localStorage.setItem(KEY,JSON.stringify(checked))}catch(e){} return; }
  pend.add(id); if(busy.has(id)) return; busy.add(id);
  while(pend.has(id)){ pend.delete(id);
    try{ const ref=db.doc('checks/'+id); checked[id]? await ref.set({v:true}) : await ref.delete(); }
    catch(e){ document.getElementById('msg').textContent = e&&e.code==='invalid_argument' ? 'Je kan deze lijst bekijken, maar niet afvinken. Vraag om de rol Bijdrager of Bewerker.' : 'Opslaan lukte niet. Controleer je verbinding.'; }
  }
  busy.delete(id);
}
list.addEventListener('change',e=>{const id=e.target.dataset.id; if(!id) return; if(e.target.checked) checked[id]=true; else delete checked[id]; count(); save(id);});
paint();
// ---- vinkjes delen via link (geen server nodig) ----
const VER='v1';
function encode(){ const bytes=new Uint8Array(Math.ceil(items.length/8)); items.forEach((it,n)=>{ if(checked[it.id]) bytes[n>>3]|=1<<(n&7); });
  let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function decode(str){ try{ const s=atob(str.replace(/-/g,'+').replace(/_/g,'/')); const out=[]; items.forEach((it,n)=>{ const b=s.charCodeAt(n>>3)||0; if(b&(1<<(n&7))) out.push(it.id); }); return out; }catch(e){ return null; } }
function persistAll(){ try{localStorage.setItem(KEY,JSON.stringify(checked))}catch(e){} }
const m=location.hash.match(/^#(v1)\.([A-Za-z0-9_-]+)$/);
if(m){ const ids=decode(m[2]); history.replaceState(null,'',location.pathname+location.search);
  if(ids){ const nieuw=ids.filter(id=>!checked[id]).length;
    if(nieuw===0) msg('Deze link bevat geen nieuwe vinkjes.');
    else if(confirm(`Deze link bevat ${nieuw} vinkje(s) die jij nog niet hebt. Samenvoegen met jouw lijst?`)){ ids.forEach(id=>checked[id]=true); persistAll(); paint(); msg(`${nieuw} vinkje(s) samengevoegd.`); } } }
function msg(s){ const el=document.getElementById('msg'); el.textContent=s; el.classList.add('ok'); }
document.getElementById('share').addEventListener('click',async()=>{
  const url=location.origin+location.pathname+'#'+VER+'.'+encode();
  try{ if(navigator.share){ await navigator.share({title:'Onze verhuischecklist',text:'Mijn vinkjes voor de verhuischecklist:',url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); msg('Link gekopieerd. Stuur hem naar Marin.'); }catch(e){ prompt('Kopieer deze link:',url); }
});
})();
</script>
</body>
